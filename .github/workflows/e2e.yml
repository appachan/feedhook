name: E2E

# Not run on pushes to main: Dependabot auto-merges with GITHUB_TOKEN, which does not trigger
# workflows, so most changes would skip it anyway. Run it by hand before a release instead.
on:
  workflow_dispatch:
  schedule:
    # Every Monday at 09:00 JST.
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.1
        with:
          minimum_release_age: 7d
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --locked --test e2e -- --ignored
        env:
          FEEDHOOK_E2E_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
